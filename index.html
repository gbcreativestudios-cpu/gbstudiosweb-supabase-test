<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GB Studios — Creative Studio</title>
    <meta name="description" content="GB Studios is a premium creative studio specializing in motion design, brand identity, and immersive event visuals." />
    <meta property="og:title" content="GB Studios — Creative Studio" />
    <meta property="og:description" content="A premium creative studio specializing in motion design, brand identity, and immersive event visuals." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <form name="project-brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" /><input type="text" name="company" /><input type="email" name="email" />
      <input type="tel" name="phone" /><input type="text" name="service" /><input type="text" name="budget" />
      <textarea name="description"></textarea><input type="text" name="contactMethod" /><input type="file" name="attachments" /><input type="text" name="bot-field" />
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="email" name="email" /><input type="text" name="subject" />
      <textarea name="message"></textarea><input type="text" name="bot-field" />
    </form>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
